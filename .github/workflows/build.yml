name: Build and Publish

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Go test
        # ubuntu runner 自带 Docker，会一并跑沙箱集成测试；
        # DeepSeek 集成测试因未设 DEEPSEEK_API_KEY 自动跳过。
        run: go test ./...

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.1 # package.json 在 frontend/ 而非仓库根，需显式指定版本

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        # 必须先 build：tanstackRouter 插件在构建时生成 routeTree.gen.ts（被 gitignore），
        # 后续 tsc 类型检查依赖它。
        working-directory: frontend
        run: pnpm build

      - name: Lint frontend
        working-directory: frontend
        run: pnpm exec eslint .

      - name: Typecheck frontend
        working-directory: frontend
        run: pnpm exec tsc -b

  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - variant: all-in-one
            is_primary: true
          - variant: external-db
            is_primary: false
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.variant }}
            type=raw,value=latest,enable=${{ matrix.is_primary && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
            type=semver,pattern={{version}},enable=${{ matrix.is_primary }}
            type=sha,prefix=${{ matrix.variant }}-
          flavor: |
            latest=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          target: ${{ matrix.variant }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
